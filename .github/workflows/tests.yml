name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -t . -v
      - run: node --test tests/test_dashboard.cjs tests/test_position_payoff.cjs
      - run: node --check app/static/app.js
      - run: uv build
      - run: git diff --exit-code
